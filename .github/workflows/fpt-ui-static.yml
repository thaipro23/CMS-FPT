name: FPT UI Static Validation

on:
  push:
    branches:
      - fpt-indigo-ui
  pull_request:
    paths:
      - 'tutor-plugins/fpt_indigo_ui.py'
      - 'tutor-plugins/fpt_haproxy_ingress.py'
      - 'openedx_unit_reset/**'
      - 'fpt_indigo_ui/**'
      - 'scripts/fpt-ui-*.sh'
      - 'scripts/fpt-ui-*.py'
      - 'scripts/fpt-haproxy-ingress-setup.sh'
      - 'scripts/fpt-ulmo-upgrade.sh'
      - '.github/workflows/fpt-ui-static.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tool versions
        run: |
          python --version
          node --version
          bash --version | head -n1
          shellcheck --version

      - name: ShellCheck deployment scripts
        run: |
          shellcheck \
            scripts/fpt-ui-setup.sh \
            scripts/fpt-ui-build.sh \
            scripts/fpt-ui-openedx-overlay.sh \
            scripts/fpt-ui-clean-openedx-rebuild.sh \
            scripts/fpt-ui-smoke.sh \
            scripts/fpt-ui-validate-static.sh \
            scripts/fpt-ui-validate-polish.sh \
            scripts/fpt-ui-validate-homepage-slider.sh \
            scripts/fpt-haproxy-ingress-setup.sh \
            scripts/fpt-ulmo-upgrade.sh

      - name: Validate vendored image resolution and manifest
        run: |
          python -m py_compile scripts/fpt-ui-validate-assets.py scripts/fpt-ui-refresh-assets.py
          python scripts/fpt-ui-validate-assets.py

      - name: Validate MySQL replica contract
        run: |
          python -m py_compile scripts/fpt-ui-validate-db-replica.py
          python scripts/fpt-ui-validate-db-replica.py

      - name: Validate HAProxy ingress contract
        run: |
          python -m py_compile tutor-plugins/fpt_haproxy_ingress.py scripts/fpt-ui-validate-haproxy-ingress.py
          python scripts/fpt-ui-validate-haproxy-ingress.py

      - name: Validate FPT UI source and fixtures
        run: bash scripts/fpt-ui-validate-static.sh

      - name: Validate responsive slider polish
        run: bash scripts/fpt-ui-validate-polish.sh
