name: Assistant align FPT plugins

on:
  push:
    branches:
      - fpt-indigo-ui

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fpt-indigo-ui
          fetch-depth: 0

      - name: Align connector limit and unit-reset version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('openedx_unit_reset/setup.py'): [
                  ("version='0.4.14.7'", "version='0.4.15'"),
              ],
              Path('openedx_unit_reset/openedx_unit_reset/__init__.py'): [
                  ("__version__ = '0.4.14.5'", "__version__ = '0.4.15'"),
              ],
              Path('openedx_unit_reset/openedx_unit_reset/settings/common.py'): [
                  ("OPENEDX_UNIT_RESET_PLUGIN_VERSION = '0.4.14.5'", "OPENEDX_UNIT_RESET_PLUGIN_VERSION = '0.4.15'"),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected anchor not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          default_old = "MAX_AI_CONNECTOR_BODY_BYTES = int(os.environ.get('AI_CONNECTOR_MAX_BODY_BYTES') or 2 * 1024 * 1024)"
          default_new = """DEFAULT_AI_CONNECTOR_MAX_BODY_BYTES = 24 * 1024 * 1024\nMAX_AI_CONNECTOR_BODY_BYTES = int(\n    os.environ.get('AI_CONNECTOR_MAX_BODY_BYTES')\n    or getattr(settings, 'AI_CONNECTOR_MAX_BODY_BYTES', None)\n    or DEFAULT_AI_CONNECTOR_MAX_BODY_BYTES\n)"""
          for raw_path in (
              'openedx_connector_plugin/openedx_ai_connector/auth.py',
              'openedx_connector_plugin/openedx_ai_connector/studio.py',
          ):
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              if default_old not in text:
                  raise SystemExit(f'Expected 2 MiB connector default not found in {path}')
              path.write_text(text.replace(default_old, default_new, 1), encoding='utf-8')
          PY

      - name: Verify source contracts
        shell: bash
        run: |
          python -m py_compile \
            openedx_connector_plugin/openedx_ai_connector/auth.py \
            openedx_connector_plugin/openedx_ai_connector/studio.py \
            openedx_unit_reset/openedx_unit_reset/__init__.py \
            openedx_unit_reset/openedx_unit_reset/settings/common.py \
            openedx_unit_reset/setup.py
          grep -F "version='0.4.15'" openedx_unit_reset/setup.py
          grep -F "__version__ = '0.4.15'" openedx_unit_reset/openedx_unit_reset/__init__.py
          grep -F "OPENEDX_UNIT_RESET_PLUGIN_VERSION = '0.4.15'" openedx_unit_reset/openedx_unit_reset/settings/common.py
          grep -F "DEFAULT_AI_CONNECTOR_MAX_BODY_BYTES = 24 * 1024 * 1024" openedx_connector_plugin/openedx_ai_connector/auth.py
          grep -F "getattr(settings, 'AI_CONNECTOR_MAX_BODY_BYTES', None)" openedx_connector_plugin/openedx_ai_connector/auth.py
          grep -F "DEFAULT_AI_CONNECTOR_MAX_BODY_BYTES = 24 * 1024 * 1024" openedx_connector_plugin/openedx_ai_connector/studio.py
          git diff --check

      - name: Commit source changes and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_assistant_align_plugins.yml
          git add openedx_connector_plugin/openedx_ai_connector/auth.py \
                  openedx_connector_plugin/openedx_ai_connector/studio.py \
                  openedx_unit_reset/setup.py \
                  openedx_unit_reset/openedx_unit_reset/__init__.py \
                  openedx_unit_reset/openedx_unit_reset/settings/common.py
          git commit -m "fix: align connector limit and unit-reset version"
          git push origin HEAD:fpt-indigo-ui
