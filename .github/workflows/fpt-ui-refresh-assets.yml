name: Refresh FPT UI Official Assets

on:
  push:
    branches:
      - fpt-indigo-ui
    paths:
      - '.github/workflows/fpt-ui-refresh-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpt-ui-official-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout UAT branch
        uses: actions/checkout@v4
        with:
          ref: fpt-indigo-ui
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'

      - name: Download, validate and optimize official imagery
        run: python scripts/fpt-ui-refresh-assets.py

      - name: Show resulting assets and build contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          root = Path('fpt_indigo_ui/assets')
          names = (
              'fpt-polytechnic-logo.png',
              'fpt-students.png',
              'fpt-campus-primary.jpg',
              'fpt-campus-secondary.jpg',
          )
          for name in names:
              path = root / name
              with Image.open(path) as image:
                  print(f'{name}: {image.width}x{image.height}, {path.stat().st_size} bytes, {image.format}')

          photos = names[1:]
          card_w, card_h, label_h, gap = 640, 400, 44, 24
          sheet = Image.new('RGB', (card_w, len(photos) * (card_h + label_h + gap) - gap), 'white')
          draw = ImageDraw.Draw(sheet)
          font = ImageFont.load_default(size=20)
          y = 0
          for name in photos:
              with Image.open(root / name) as image:
                  image = ImageOps.exif_transpose(image).convert('RGB')
                  preview = ImageOps.fit(image, (card_w, card_h), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                  sheet.paste(preview, (0, y))
              draw.text((14, y + card_h + 10), name, fill='black', font=font)
              y += card_h + label_h + gap
          sheet.save('/tmp/fpt-ui-contact-sheet.jpg', quality=90, optimize=True, progressive=True)
          PY
          cat fpt_indigo_ui/assets/manifest.json

      - name: Upload contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: fpt-ui-contact-sheet
          path: /tmp/fpt-ui-contact-sheet.jpg
          retention-days: 3
          if-no-files-found: error

      - name: Commit vendored assets
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fpt_indigo_ui/assets/fpt-students.png \
            fpt_indigo_ui/assets/fpt-campus-primary.jpg \
            fpt_indigo_ui/assets/fpt-campus-secondary.jpg \
            fpt_indigo_ui/assets/manifest.json
          if git diff --cached --quiet; then
            echo 'Official assets already match the curated sources.'
          else
            git commit -m 'assets: refresh high-resolution official FPT imagery'
            git push origin HEAD:fpt-indigo-ui
          fi
